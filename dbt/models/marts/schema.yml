version: 2
models:
  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]
  - name: dim_question
    columns:
      - name: question_id
        data_tests: [unique, not_null]
      - name: section
        data_tests:
          - accepted_values:
              arguments: {values: ['listening', 'reading']}
  - name: dim_user
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: first_seen_date
        data_tests: [not_null]
  - name: fct_answer
    columns:
      - name: question_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_question'), field: question_id}
      - name: answer_date
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
  - name: fct_user_day
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_user'), field: user_id}
      - name: activity_date
        data_tests: [not_null]
